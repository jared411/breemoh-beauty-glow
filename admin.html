<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Bremoh Beauty Glow</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="login" class="login-box">
  <h2 style="margin-bottom:6px">Admin Login</h2>
  <p style="color:var(--muted);font-size:.9rem">Bremoh Beauty Glow</p>
  <form id="login-form">
    <label for="l-email">Email</label><input id="l-email" type="email" required>
    <label for="l-pass">Password</label><input id="l-pass" type="password" required>
    <button class="btn" style="width:100%;margin-top:18px">Sign in</button>
    <div id="login-msg" class="msg"></div>
  </form>
</div>

<div id="dash" class="hidden">
  <header class="nav">
    <div class="container">
      <a href="index.html" class="logo"><img src="assets/logo.svg" alt="" width="36" height="36">Bremoh <span>Admin</span></a>
      <button id="logout" class="btn small outline">Log out</button>
    </div>
  </header>

  <div class="container admin-wrap">
    <div class="tabs">
      <button data-tab="bookings" class="active">Bookings</button>
      <button data-tab="services">Services</button>
      <button data-tab="gallery">Gallery</button>
      <button data-tab="products">Products</button>
      <button data-tab="orders">Orders</button>
    </div>

    <!-- Bookings -->
    <div id="tab-bookings">
      <div class="toolbar">
        <select id="status-filter" style="width:auto">
          <option value="">All statuses</option>
          <option>pending</option><option>confirmed</option><option>completed</option><option>cancelled</option>
        </select>
        <button id="refresh" class="btn small outline">Refresh</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Customer</th><th>Service</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="bookings-body"></tbody>
      </table></div>
    </div>

    <!-- Services -->
    <div id="tab-services" class="hidden">
      <form id="service-form" class="panel" style="margin-bottom:24px;max-width:none">
        <h3 id="sf-title">Add service</h3>
        <input type="hidden" id="sf-id">
        <div class="row">
          <div><label>Name</label><input id="sf-name" required></div>
          <div><label>Price</label><input id="sf-price" type="number" min="0" step="0.01" required></div>
        </div>
        <div class="row">
          <div><label>Duration (minutes)</label><input id="sf-duration" type="number" min="5" step="5" value="60" required></div>
          <div><label>Image (optional)</label><input id="sf-image" type="file" accept="image/*"></div>
        </div>
        <label>Description</label><textarea id="sf-desc" rows="2"></textarea>
        <label style="display:flex;gap:8px;align-items:center"><input id="sf-active" type="checkbox" checked style="width:auto"> Visible on website</label>
        <div style="margin-top:16px;display:flex;gap:8px">
          <button class="btn">Save</button>
          <button type="button" id="sf-cancel" class="btn outline hidden">Cancel edit</button>
        </div>
        <div id="sf-msg" class="msg"></div>
      </form>
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Price</th><th>Duration</th><th>Visible</th><th>Actions</th></tr></thead>
        <tbody id="services-body"></tbody>
      </table></div>
    </div>

    <!-- Gallery -->
    <div id="tab-gallery" class="hidden">
      <form id="gallery-form" class="panel" style="margin-bottom:24px;max-width:none">
        <h3>Upload to gallery</h3>
        <label>Photo</label><input id="gf-file" type="file" accept="image/*" required>
        <label>Caption (optional)</label><input id="gf-caption" maxlength="120">
        <button class="btn" style="margin-top:16px">Upload</button>
        <div id="gf-msg" class="msg"></div>
      </form>
      <div id="gallery-admin" class="gallery"></div>
    </div>

    <!-- Products -->
    <div id="tab-products" class="hidden">
      <form id="product-form" class="panel" style="margin-bottom:24px;max-width:none">
        <h3 id="pf-title">Add product</h3>
        <input type="hidden" id="pf-id">
        <div class="row">
          <div><label>Name</label><input id="pf-name" required></div>
          <div><label>Price</label><input id="pf-price" type="number" min="0" step="0.01" required></div>
        </div>
        <div class="row">
          <div><label>Stock</label><input id="pf-stock" type="number" min="0" step="1" value="10" required></div>
          <div><label>Image (optional)</label><input id="pf-image" type="file" accept="image/*"></div>
        </div>
        <label>Description</label><textarea id="pf-desc" rows="2"></textarea>
        <label style="display:flex;gap:8px;align-items:center"><input id="pf-active" type="checkbox" checked style="width:auto"> Visible in shop</label>
        <div style="margin-top:16px;display:flex;gap:8px">
          <button class="btn">Save</button>
          <button type="button" id="pf-cancel" class="btn outline hidden">Cancel edit</button>
        </div>
        <div id="pf-msg" class="msg"></div>
      </form>
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Visible</th><th>Actions</th></tr></thead>
        <tbody id="products-body"></tbody>
      </table></div>
    </div>

    <!-- Orders -->
    <div id="tab-orders" class="hidden">
      <div class="toolbar">
        <select id="order-filter" style="width:auto">
          <option value="">All statuses</option>
          <option>new</option><option>confirmed</option><option>delivered</option><option>cancelled</option>
        </select>
        <button id="order-refresh" class="btn small outline">Refresh</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="orders-body"></tbody>
      </table></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
