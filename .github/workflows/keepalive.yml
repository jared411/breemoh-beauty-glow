name: Keep Supabase awake

# Supabase free projects pause after a period of inactivity.
# This job makes a tiny read request every 3 days so the project stays active.
# It reads your public URL and anon key from js/config.js, so no secrets are needed.

on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' js/config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' js/config.js)
          if [[ -z "$URL" || "$URL" == *YOUR-PROJECT* || -z "$KEY" || "$KEY" == *YOUR-ANON* ]]; then
            echo "js/config.js is not filled in yet. Skipping."
            exit 0
          fi
          # New-style publishable keys (sb_publishable_...) go in the apikey header only
          AUTH=()
          if [[ "$KEY" != sb_* ]]; then AUTH=(-H "Authorization: Bearer $KEY"); fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" "${AUTH[@]}" \
            "$URL/rest/v1/services?select=id&limit=1")
          echo "Supabase responded: $STATUS"
          if [[ "$STATUS" != 2* ]]; then
            echo "Ping failed. Check that the project is not paused." >&2
            exit 1
          fi
